name: Deploy MLOps to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-lambda-mlops-hassan-api
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: mlops-hassan-api
  LAMBDA_FUNCTION: mlops-hassan-api

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v --tb=short

  deploy:
    name: Build & Deploy to AWS Lambda
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build --platform linux/amd64 --provenance=false \
            -f Dockerfile.lambda \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Update Lambda function
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail

          wait_for_lambda_ready() {
            for i in $(seq 1 36); do
              STATUS=$(aws lambda get-function-configuration \
                --function-name "$LAMBDA_FUNCTION" \
                --query 'LastUpdateStatus' \
                --output text)
              STATE=$(aws lambda get-function-configuration \
                --function-name "$LAMBDA_FUNCTION" \
                --query 'State' \
                --output text)

              if [ "$STATUS" = "Failed" ]; then
                echo "Lambda LastUpdateStatus=Failed"
                return 1
              fi

              if [ "$STATE" = "Active" ] && { [ "$STATUS" = "Successful" ] || [ "$STATUS" = "None" ]; }; then
                return 0
              fi

              echo "Waiting for Lambda readiness (attempt $i/36): State=$STATE LastUpdateStatus=$STATUS"
              sleep 10
            done

            echo "Timed out waiting for Lambda to become ready"
            return 1
          }

          update_lambda_with_retry() {
            IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
            for attempt in 1 2 3 4 5 6; do
              wait_for_lambda_ready

              set +e
              OUTPUT=$(aws lambda update-function-code \
                --function-name "$LAMBDA_FUNCTION" \
                --image-uri "$IMAGE_URI" 2>&1)
              RC=$?
              set -e

              if [ $RC -eq 0 ]; then
                echo "$OUTPUT"
                return 0
              fi

              if echo "$OUTPUT" | grep -q "ResourceConflictException"; then
                echo "Lambda update conflict on attempt $attempt; retrying after wait..."
                sleep $((attempt * 15))
                continue
              fi

              echo "$OUTPUT"
              return $RC
            done

            echo "Failed to update Lambda after retries"
            return 1
          }

          update_lambda_with_retry
          aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION"
          aws lambda wait function-active --function-name "$LAMBDA_FUNCTION"
          echo "Lambda updated successfully"

      - name: Verify deployment
        run: |
          API_ID=$(aws apigateway get-rest-apis \
            --query "items[?name=='mlops-hassan-api'].id" \
            --output text)
          URL="https://${API_ID}.execute-api.${AWS_REGION}.amazonaws.com/dev/health"
          echo "Testing: $URL"
          sleep 10
          curl -f $URL || echo "Health check returned unhealthy (models may need loading)"
